version: "3.9"

# 公地引擎开发环境基础设施
# 启动：docker compose -f deployments/docker-compose.yml up -d
# 停止：docker compose -f deployments/docker-compose.yml down
# 清理：docker compose -f deployments/docker-compose.yml down -v

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: commons-engine-db
    environment:
      POSTGRES_DB: commons_engine
      POSTGRES_USER: commons
      POSTGRES_PASSWORD: commons_dev_pwd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commons -d commons_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: commons-engine-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
