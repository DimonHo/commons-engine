name: Demo (docker-compose)

# 端到端「可运行 demo」验证：在 GitHub runner 上用真实 PostgreSQL/PostGIS + Redis
# 启动基础设施，构建并运行 app（默认 profile，连接 postgres + Flyway 迁移），
# 然后执行 deployments/smoke-test.sh 全链路冒烟。
# 这是 README「快速启动」一节的权威可复现证据（弥补本地无法验证 docker 的缺口）。
# 关联：#41（可运行 demo）、Epic #35（阶段1 收尾）

on:
  push:
    branches: [main]
    paths:
      - 'deployments/**'
      - 'backend/app/**'
      - 'backend/matching-engine/**'
      - 'backend/identity/**'
      - 'backend/payment/**'
      - '.github/workflows/demo.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Start infrastructure (PostgreSQL/PostGIS + Redis)
        run: docker compose -f deployments/docker-compose.yml up -d --wait

      - name: Build app (bootJar)
        run: ./gradlew :backend:app:bootJar --console=plain

      - name: Run app against PostgreSQL
        run: |
          JAR=$(ls backend/app/build/libs/*.jar | grep -v -E 'plain|sources' | head -1)
          echo "Running $JAR"
          java -jar "$JAR" > app.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "App healthy after ~$((i*2))s"; exit 0
            fi
            sleep 2
          done
          echo "::error::App failed to become healthy"
          tail -n 80 app.log
          exit 1

      - name: Smoke test (end-to-end HTTP)
        run: bash deployments/smoke-test.sh

      - name: App log (on failure)
        if: failure()
        run: tail -n 120 app.log || true

      - name: Stop app
        if: always()
        run: kill $(cat app.pid) 2>/dev/null || true

      - name: Tear down infrastructure
        if: always()
        run: docker compose -f deployments/docker-compose.yml down -v || true
