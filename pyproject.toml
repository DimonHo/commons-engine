[project]
name = "commons-engine"
version = "0.0.1"
description = "公地引擎 — 开源公地基础设施，让劳动者合作社运营平台经济"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Commons Engine Contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

# ── Ruff：lint + format ──────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# ── Pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
# 让各 package 模块无需安装即可被测试导入
pythonpath = ["packages/matching-engine"]
testpaths = ["tests", "packages"]
addopts = "-q"
